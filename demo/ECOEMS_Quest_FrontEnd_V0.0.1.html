<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOEMS Quest — Front end V0.0.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap');
:root{
  --outer:#121215; --bg:#1B1B20; --panel:#26262C; --panel2:#223050; --line:#35496E;
  --ink:#F4F4F6; --dim:#A5A3B8;
  --gold:#FF8A3D; --gold-deep:#D9641E; --green:#4BD98A; --red:#FF5D73; --blue:#5B9BFF;
  --ghost-sh:#141417; --node-sh:#0F0F1280; --sel-bg:#263A5E;
  --tint-ok:#153C2C; --tint-bad:#472034; --tint-warn:#4A2C14;
}
body.light{
  --outer:#E3E7EF; --bg:#F5F6FA; --panel:#FFFFFF; --panel2:#EAEFF8; --line:#C9D3E6;
  --ink:#1E2433; --dim:#68718C;
  --gold:#FF8A3D; --gold-deep:#C75812; --green:#1FA45F; --red:#E03B55; --blue:#2E6FD9;
  --ghost-sh:#C7CEDE; --node-sh:#C7CEDE; --sel-bg:#DCE8FB;
  --tint-ok:#DDF2E6; --tint-bad:#FBE2E7; --tint-warn:#FBE9DA;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{background:var(--outer);}
body{font-family:'Baloo 2', system-ui, -apple-system, sans-serif; color:var(--ink); display:flex; justify-content:center; min-height:100vh;}
#app{width:100%; max-width:440px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden;}

/* ---------- transiciones globales ---------- */
body *{transition:background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .12s ease, transform .12s ease, opacity .15s ease;}
@media (prefers-reduced-motion: reduce){
  body *{transition-duration:.001s !important; animation-duration:.001s !important;}
}

/* ---------- barra superior ---------- */
.topbar{display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--panel); border-bottom:2px solid var(--line); position:sticky; top:0; z-index:20;}
.topbar .tb-title{font-weight:800; font-size:17px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.iconbtn{background:var(--panel2); border:2px solid var(--line); color:var(--ink); border-radius:14px; width:40px; height:40px; font-size:18px; font-family:inherit; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.iconbtn:active{transform:scale(.94);}

.screen{flex:1; padding:20px 18px 40px; overflow-y:auto; display:none;}
.screen.active{display:block;}
.screen.nav-fwd{animation:screenFwd .22s cubic-bezier(.22,1,.36,1);}
.screen.nav-back{animation:screenBack .22s cubic-bezier(.22,1,.36,1);}
@keyframes screenFwd{from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:none;}}
@keyframes screenBack{from{opacity:0; transform:translateX(-18px);} to{opacity:1; transform:none;}}

h1{font-size:26px; font-weight:800; line-height:1.15;}
h2{font-size:20px; font-weight:800; margin-bottom:6px;}
p{line-height:1.45;}
.dim{color:var(--dim); font-size:14px;}
.spacer{height:14px;}

/* ---------- botones ---------- */
.btn{display:block; width:100%; padding:14px 18px; border-radius:18px; border:none; font-family:inherit; font-size:17px; font-weight:800; cursor:pointer; text-align:center; color:#2A1200; background:var(--gold); box-shadow:0 4px 0 var(--gold-deep); margin-top:12px;}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--gold-deep);}
.btn.ghost{background:var(--panel2); color:var(--ink); box-shadow:0 4px 0 var(--ghost-sh); border:2px solid var(--line);}
.btn.green{background:var(--green); box-shadow:0 4px 0 #22995B; color:#03301A;}
.btn.small{padding:9px 14px; font-size:14px; border-radius:14px; width:auto; display:inline-block;}
.btn:disabled{opacity:.45; cursor:default;}

.card{background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:16px; margin-top:14px;}
.field{width:100%; padding:13px 14px; margin-top:10px; border-radius:14px; border:2px solid var(--line); background:var(--panel2); color:var(--ink); font-family:inherit; font-size:16px;}
.field::placeholder{color:var(--dim);}
.badge{display:inline-block; background:var(--panel2); border:1.5px solid var(--line); border-radius:999px; padding:3px 12px; font-size:13px; font-weight:700; color:var(--dim);}
.tag-demo{background:rgba(255,138,61,.14); border-color:var(--gold); color:var(--gold);}

/* ---------- portada ---------- */
.hero{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:46px;}
.logo-shield{width:118px; height:118px; border-radius:34px; background:linear-gradient(160deg,var(--panel2),var(--panel)); border:3px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:56px; box-shadow:0 10px 30px rgba(0,0,0,.4); margin-bottom:18px;}
.hero h1 span{color:var(--gold);}

/* ---------- home ---------- */
.mode-card{display:flex; align-items:center; gap:14px; background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:16px; margin-top:12px; cursor:pointer;}
.mode-card:active{transform:scale(.98);}
.mode-ico{width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;}
.mode-card .mc-txt{flex:1;}
.mode-card .mc-txt b{font-size:17px; display:block;}
.mode-card .mc-txt span{font-size:13px; color:var(--dim);}
.mode-card .chev{color:var(--dim); font-size:20px; font-weight:800;}
.mode-card.competir-card{border-color:var(--gold); background:linear-gradient(90deg, var(--panel), var(--panel) 60%, rgba(255,138,61,.10));}
.racha-pill{display:flex; align-items:center; gap:12px; background:var(--panel); border:2px solid var(--gold); border-radius:18px; padding:12px 16px; margin-bottom:16px; cursor:pointer;}
.racha-pill:active{transform:scale(.98);}

/* ---------- dashboard / grid de inicio (V0.0.1) ---------- */
.dash-card{background:linear-gradient(160deg,var(--panel2),var(--panel)); border:2px solid var(--line); border-radius:22px; padding:18px; margin-top:6px; display:flex; align-items:center; gap:14px; cursor:pointer;}
.dash-card:active{transform:scale(.98);}
.dash-card .dash-flame{font-size:32px; flex-shrink:0;}
.dash-card .dash-txt{flex:1;}
.dash-card .dash-txt b{font-size:17px; display:block;}
.dash-stats{display:flex; gap:10px; margin-top:12px;}
.stat-box{flex:1; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:10px 8px; text-align:center;}
.stat-box b{display:block; font-size:20px; color:var(--gold);}
.stat-box span{font-size:11px; color:var(--dim);}
.sec-title{font-size:13px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:var(--dim); margin:22px 0 10px;}
.tile-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.tile{background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:16px 14px; cursor:pointer; display:flex; flex-direction:column; gap:10px; min-height:112px;}
.tile:active{transform:scale(.97);}
.tile .tile-ico{width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
.tile b{font-size:15px; display:block; line-height:1.2;}
.tile span{font-size:12px; color:var(--dim); display:block; margin-top:2px;}
.feature-card{display:flex; align-items:center; gap:14px; border-radius:22px; padding:18px; margin-top:12px; cursor:pointer; background:linear-gradient(120deg, rgba(255,138,61,.16), var(--panel) 55%); border:2px solid var(--gold);}
.feature-card:active{transform:scale(.98);}
.feature-card .feature-ico{width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,var(--gold),var(--gold-deep)); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; box-shadow:0 4px 0 var(--gold-deep);}
.feature-card .mc-txt{flex:1;}
.feature-card .mc-txt b{font-size:17px; display:block;}
.feature-card .mc-txt span{display:block; margin-top:3px; font-size:13px;}
.feature-card .chev{color:var(--gold); font-size:22px; font-weight:800;}

/* ---------- mapa de niveles ---------- */
.map-wrap{position:relative; margin-top:10px;}
.node-row{display:flex; align-items:center; gap:14px; margin:22px 0; position:relative;}
.node-row.right{flex-direction:row-reverse; text-align:right;}
.lvl-node{width:74px; height:74px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:22px; cursor:pointer; flex-shrink:0; border:4px solid var(--line); background:var(--panel2); color:var(--dim); box-shadow:0 6px 0 var(--node-sh);}
.lvl-node.open{background:var(--gold); border-color:#fff3; color:#2A1200; box-shadow:0 6px 0 var(--gold-deep);}
.lvl-node.done{background:var(--green); border-color:#fff3; color:#03301A; box-shadow:0 6px 0 #22995B;}
.lvl-node:active{transform:translateY(3px);}
.lvl-node.locked{cursor:default;}
.lvl-info b{display:block; font-size:15px;}
.lvl-stars{color:var(--gold); font-size:13px; letter-spacing:1px;}
.trail{position:absolute; left:36px; top:74px; width:4px; height:44px; background:var(--line); border-radius:2px;}

/* ---------- quiz ---------- */
.quiz-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.timer{font-weight:800; font-size:16px; background:var(--panel2); border:2px solid var(--line); border-radius:999px; padding:5px 14px;}
.timer.low{color:var(--red); border-color:var(--red);}
.progress{height:12px; background:var(--panel2); border-radius:999px; overflow:hidden; border:2px solid var(--line); margin:8px 0 16px;}
.progress i{display:block; height:100%; background:var(--gold); border-radius:999px; transition:width .25s;}
.lectura{background:var(--panel2); border:2px solid var(--line); border-radius:16px; padding:12px 14px; font-size:14px; line-height:1.5; margin-bottom:12px; max-height:180px; overflow-y:auto;}
.enunciado{font-size:17px; font-weight:700; line-height:1.35; margin-bottom:14px;}
.opt{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:13px 14px; margin-top:10px; font-family:inherit; font-size:15px; color:var(--ink); cursor:pointer; line-height:1.35;}
.opt .letter{font-weight:800; color:var(--dim);}
.opt.sel{border-color:var(--blue); background:var(--sel-bg);}
.opt.ok{border-color:var(--green); background:var(--tint-ok);}
.opt.bad{border-color:var(--red); background:var(--tint-bad);}
.feedback{margin-top:12px; padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.4;}
.feedback.ok{background:var(--tint-ok); border:2px solid var(--green);}
.feedback.bad{background:var(--tint-bad); border:2px solid var(--red);}
.quiz-nav{display:flex; gap:10px; margin-top:16px;}
.quiz-nav .btn{margin-top:0;}
.repasar-btn{margin-top:12px; background:none; border:2px dashed var(--dim); color:var(--dim); border-radius:14px; padding:9px 14px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; width:100%;}
.repasar-btn.saved{border-style:solid; border-color:var(--gold); color:var(--gold);}

/* ---------- resultado ---------- */
.score-big{font-size:52px; font-weight:800; text-align:center; margin:10px 0 2px;}
.stars-big{text-align:center; font-size:30px; color:var(--gold); letter-spacing:4px; margin-bottom:6px;}
.mat-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1.5px solid var(--line); font-size:15px;}
.mat-row:last-child{border-bottom:none;}
.pill{border-radius:999px; padding:2px 12px; font-size:13px; font-weight:800;}
.pill.f{background:var(--tint-ok); color:var(--green);}
.pill.r{background:var(--tint-warn); color:var(--gold);}
.pill.d{background:var(--tint-bad); color:var(--red);}

/* ---------- tutoria ---------- */
.chat-box{display:flex; flex-direction:column; gap:10px; padding-bottom:10px;}
.msg{max-width:85%; padding:11px 14px; border-radius:18px; font-size:15px; line-height:1.4; white-space:pre-wrap;}
.msg.user{align-self:flex-end; background:var(--gold); color:#2A1200; border-bottom-right-radius:6px; font-weight:600;}
.msg.ia{align-self:flex-start; background:var(--panel); border:2px solid var(--line); border-bottom-left-radius:6px;}
.msg.ia.err{border-color:var(--red);}
.chat-input-row{display:flex; gap:8px; margin-top:10px; position:sticky; bottom:0; background:var(--bg); padding:8px 0 4px;}
.chat-input-row textarea{flex:1; resize:none; height:52px;}
.chat-input-row .btn{width:auto; margin-top:0; padding:10px 16px;}
.counter{font-size:13px; color:var(--dim); text-align:center; margin-top:4px;}

/* ---------- pagos ---------- */
.plan{display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:2px solid var(--line); border-radius:18px; padding:16px; margin-top:12px; cursor:pointer;}
.plan.best{border-color:var(--gold);}
.plan b{font-size:17px;}
.plan .price{font-size:20px; font-weight:800; color:var(--gold);}
.plan .sub{font-size:13px; color:var(--dim); display:block;}

/* ---------- modal ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(14,14,16,.75); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; opacity:0; pointer-events:none;}
.modal-bg.show{opacity:1; pointer-events:auto;}
.modal{background:var(--panel); border:2px solid var(--line); border-radius:22px; padding:22px; width:100%; max-width:360px; transform:scale(.92) translateY(6px); opacity:0;}
.modal-bg.show .modal{transform:none; opacity:1;}
.modal h2{margin-bottom:8px;}

.gold{color:var(--gold);} .green-t{color:var(--green);} .red-t{color:var(--red);}
.center{text-align:center;}
.row2{display:flex; gap:10px;} .row2 .btn{flex:1;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="iconbtn" id="btn-back" title="Regresar">←</button>
    <div class="tb-title" id="tb-title">ECOEMS Quest</div>
    <button class="iconbtn theme-btn" title="Cambiar a modo claro" onclick="toggleTema()"><svg viewBox="0 0 24 24" style="width:1em;height:1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg></button>
    <button class="iconbtn" id="btn-home" title="Inicio"><svg viewBox="0 0 24 24" style="width:1em;height:1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9a1 1 0 001 1h3v-5h4v5h3a1 1 0 001-1v-9"/></svg></button>
    <button class="iconbtn" id="btn-perfil" title="Perfil"><svg viewBox="0 0 24 24" style="width:1em;height:1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1-4 4-6 7.5-6s6.5 2 7.5 6"/></svg></button>
  </div>
  <div id="screens"></div>
  <div class="modal-bg" id="modal-bg"><div class="modal" id="modal-content"></div></div>
</div>

<script>
/* =====================================================================
   ECOEMS QUEST — DEMO NAVEGABLE
   Versión corta: niveles de 3 preguntas, ejercicio de 5, simulacro de 8.
   Todo el estado vive en memoria (se reinicia al recargar).
   TutorIA llama a la API real de Anthropic.
===================================================================== */

/* ---------------- BANCO DE PREGUNTAS (demo, reactivos originales) ---------------- */
const LECTURA_1 = "El mercado de Xochimilco abre antes de que salga el sol. Doña Remedios acomoda sus flores mientras los canales todavía huelen a noche. Dice que vender no es su oficio: su oficio es conocer a la gente. Sabe qué ramo lleva quien va a una boda y cuál busca quien va a pedir perdón. Por eso, cuando un cliente duda, ella no pregunta qué flor quiere, sino a quién se la va a dar.";

const BANK = [
 // Matemáticas
 {id:"MAT-01", m:"Matemáticas", t:"Fracciones", q:"¿Cuál es el resultado de 3/4 + 1/8?", o:["7/8","4/12","1/2","5/8"], r:0, f:"Se convierte 3/4 a 6/8 y se suma 1/8: 6/8 + 1/8 = 7/8."},
 {id:"MAT-02", m:"Matemáticas", t:"Ecuaciones", q:"Si 2x − 6 = 10, ¿cuánto vale x?", o:["2","6","8","16"], r:2, f:"2x = 16, por lo tanto x = 8."},
 {id:"MAT-03", m:"Matemáticas", t:"Porcentajes", q:"El 25% de 240 es:", o:["48","50","60","80"], r:2, f:"25% es la cuarta parte: 240 ÷ 4 = 60."},
 // Habilidad Matemática
 {id:"HMA-01", m:"Habilidad Matemática", t:"Sucesiones", q:"¿Qué número sigue en la sucesión 2, 6, 18, 54, ...?", o:["108","162","148","216"], r:1, f:"Cada término se multiplica por 3: 54 × 3 = 162."},
 {id:"HMA-02", m:"Habilidad Matemática", t:"Problemas", q:"Un tinaco se llena en 6 horas con una llave. Con dos llaves iguales abiertas, ¿en cuánto tiempo se llena?", o:["12 horas","6 horas","3 horas","2 horas"], r:2, f:"Dos llaves aportan el doble de agua, así que tardan la mitad: 3 horas."},
 {id:"HMA-03", m:"Habilidad Matemática", t:"Series espaciales", q:"Un dado marca 1 arriba. Si el 1 y el 6 son caras opuestas, ¿qué número queda abajo?", o:["2","4","5","6"], r:3, f:"Las caras opuestas de 1 es 6; si 1 está arriba, 6 queda abajo."},
 // Español
 {id:"ESP-01", m:"Español", t:"Comprensión lectora", lect:LECTURA_1, q:"Según el texto, ¿cuál es el verdadero oficio de doña Remedios?", o:["Cultivar flores en los canales","Conocer a la gente","Organizar bodas","Abrir el mercado"], r:1, f:"El texto lo dice de forma directa: 'su oficio es conocer a la gente'."},
 {id:"ESP-02", m:"Español", t:"Comprensión lectora", lect:LECTURA_1, q:"¿Qué pregunta hace doña Remedios cuando un cliente duda?", o:["Qué flor quiere","Cuánto quiere gastar","A quién se la va a dar","Para qué ocasión es"], r:2, f:"El final del texto indica que pregunta a quién va dirigido el ramo."},
 {id:"ESP-03", m:"Español", t:"Ortografía", q:"¿Cuál oración está escrita correctamente?", o:["Aver si llegas temprano.","A ver si llegas temprano.","Haber si llegas temprano.","Avér si llegas temprano."], r:1, f:"'A ver' (preposición + verbo ver) se usa para expectativa; 'haber' es otro verbo y 'aver' no existe."},
 // Habilidad Verbal
 {id:"HVE-01", m:"Habilidad Verbal", t:"Analogías", q:"Libro es a biblioteca como cuadro es a...", o:["pintor","museo","marco","pincel"], r:1, f:"La relación es objeto y lugar donde se resguarda: los cuadros se exhiben en museos."},
 {id:"HVE-02", m:"Habilidad Verbal", t:"Sinónimos", q:"Un sinónimo de 'efímero' es:", o:["eterno","pasajero","enorme","frágil"], r:1, f:"Efímero significa que dura poco tiempo: pasajero."},
 {id:"HVE-03", m:"Habilidad Verbal", t:"Antónimos", q:"El antónimo de 'escasez' es:", o:["pobreza","carencia","abundancia","ausencia"], r:2, f:"Escasez es falta de algo; su opuesto es abundancia."},
 // Biología
 {id:"BIO-01", m:"Biología", t:"Célula", q:"¿Qué organelo produce la energía de la célula?", o:["Núcleo","Ribosoma","Mitocondria","Vacuola"], r:2, f:"La mitocondria realiza la respiración celular y produce ATP."},
 {id:"BIO-02", m:"Biología", t:"Ecología", q:"En una cadena alimenticia, las plantas son organismos:", o:["consumidores","descomponedores","productores","depredadores"], r:2, f:"Las plantas producen su propio alimento mediante fotosíntesis: son productores."},
 {id:"BIO-03", m:"Biología", t:"Genética", q:"La molécula que contiene la información hereditaria es:", o:["El ARN mensajero","El ADN","La proteína","La glucosa"], r:1, f:"El ADN almacena la información genética que se hereda."},
 // Física
 {id:"FIS-01", m:"Física", t:"Mecánica", q:"Un auto recorre 120 km en 2 horas a velocidad constante. Su velocidad es:", o:["40 km/h","60 km/h","80 km/h","240 km/h"], r:1, f:"v = d/t = 120 ÷ 2 = 60 km/h."},
 {id:"FIS-02", m:"Física", t:"Leyes de Newton", q:"La ley que dice que a toda acción corresponde una reacción igual y opuesta es la:", o:["Primera ley","Segunda ley","Tercera ley","Ley de gravitación"], r:2, f:"Es la tercera ley de Newton: acción y reacción."},
 {id:"FIS-03", m:"Física", t:"Electricidad", q:"Según la ley de Ohm, si V = 12 volts y R = 4 ohms, la corriente es:", o:["48 A","8 A","3 A","0.3 A"], r:2, f:"I = V/R = 12 ÷ 4 = 3 amperes."},
 // Química
 {id:"QUI-01", m:"Química", t:"Tabla periódica", q:"El símbolo químico del sodio es:", o:["So","S","Na","N"], r:2, f:"Na viene de su nombre en latín, natrium."},
 {id:"QUI-02", m:"Química", t:"Enlaces", q:"El enlace que se forma cuando dos átomos comparten electrones es:", o:["iónico","covalente","metálico","de hidrógeno"], r:1, f:"En el enlace covalente los átomos comparten pares de electrones."},

function ligaInfo(t){
  const ligas = [{n:"Bronce",min:0,max:99,e:medal('bronce')},{n:"Plata",min:100,max:249,e:medal('plata')},{n:"Oro",min:250,max:499,e:medal('oro')},{n:"Diamante",min:500,max:99999,e:medal('diamante')}];
  const cur = ligas.find(l=>t>=l.min && t<=l.max) || ligas[ligas.length-1];
  const idx = ligas.indexOf(cur);
  const next = ligas[idx+1];
  const pct = next ? Math.round((t-cur.min)/(next.min-cur.min)*100) : 100;
  return {nombre:cur.n, emoji:cur.e, pct, next: next?next.min:null, nextNombre: next?next.n:null};
}

const $ = s => document.querySelector(s);
const screens = $("#screens");
let historyStack = [];
let currentScreen = null;
let quizActivo = false;
let navDir = "fwd";

function render(name, html, title){
  const cls = navDir === "back" ? "nav-back" : navDir === "none" ? "" : "nav-fwd";
  navDir = "fwd";
  screens.innerHTML = `<div class="screen active ${cls}">${html}</div>`;
  $("#tb-title").textContent = title || "ECOEMS Quest";
  window.scrollTo(0,0);
}
function go(name, opts={}){
  if(currentScreen && !opts.replace) historyStack.push(currentScreen);
  currentScreen = {name, opts};
  quizActivo = false;
  clearInterval(timerInt);
  navDir = opts.replace ? "none" : "fwd";
  $("#topbar").style.display = (name==="portada"||name==="login"||name==="registro") ? "none":"flex";
  SCREENS[name](opts);
}
function back(){
  if(quizActivo){ confirmSalirQuiz(); return; }
  const prev = historyStack.pop();
  if(prev){ currentScreen = prev; navDir = "back"; SCREENS[prev.name](prev.opts); $("#topbar").style.display = (prev.name==="portada")?"none":"flex"; }
  else go("home",{replace:true});
}
$("#btn-back").onclick = back;
$("#btn-home").onclick = () => { if(quizActivo){confirmSalirQuiz("home"); return;} historyStack=[]; go("home",{replace:true}); };
$("#btn-perfil").onclick = () => { if(quizActivo){confirmSalirQuiz("perfil"); return;} go("perfil"); };

/* ---------------- MOTOR DE QUIZ ---------------- */
let timerInt = null;
function startQuiz(cfg){
  // cfg: {titulo, preguntas, tiempoSeg, onFinish, contexto}
  quizActivo = true;
  const st = {i:0, resp:Array(cfg.preguntas.length).fill(null), fin:false, t:cfg.tiempoSeg};
  $("#tb-title").textContent = cfg.titulo;

  function fmt(s){ const m=Math.floor(s/60), ss=s%60; return `${m}:${ss<10?"0":""}${ss}`; }

  function terminar(auto){
    if(st.fin) return; st.fin = true; quizActivo=false; clearInterval(timerInt);
    const aciertos = cfg.preguntas.reduce((a,q,ix)=> a + (st.resp[ix]===q.r ?1:0), 0);
    cfg.onFinish(aciertos, st.resp, auto);
  }

  function paint(){
    const q = cfg.preguntas[st.i];
    const respondida = st.resp[st.i] !== null;
    const enRepaso = S.repaso.includes(q.id);
    screens.innerHTML = `<div class="screen active">
      <div class="quiz-head">
        <span class="badge">${q.m}</span>
        <span class="timer ${st.t<=30?'low':''}" id="qtimer">⏱ ${fmt(st.t)}</span>
      </div>
      <div class="progress"><i style="width:${(st.i)/cfg.preguntas.length*100}%"></i></div>
      <p class="dim">Pregunta ${st.i+1} de ${cfg.preguntas.length}</p>
      ${q.lect ? `<div class="lectura">${q.lect}</div>` : ""}
      <p class="enunciado">${q.q}</p>
      <div id="opts">${q.o.map((o,ix)=>{
        let cls="opt";
        if(respondida){ if(ix===q.r) cls+=" ok"; else if(ix===st.resp[st.i]) cls+=" bad"; }
        return `<button class="${cls}" data-ix="${ix}" ${respondida?"disabled":""}><span class="letter">${"ABCD"[ix]})</span><span>${o}</span></button>`;
      }).join("")}</div>
      ${respondida ? `<div class="feedback ${st.resp[st.i]===q.r?'ok':'bad'}"><b>${st.resp[st.i]===q.r?'¡Correcto!':'Incorrecto.'}</b> ${q.f}</div>`:""}
      <button class="repasar-btn ${enRepaso?'saved':''}" id="btn-repasar">${enRepaso?ICO.bookmark+' Guardada para repasar con TutorIA':ICO.bookmark+' Repasar — no le sé, guárdala para TutorIA'}</button>
      <div class="quiz-nav">
        <button class="btn ghost" id="q-prev" ${st.i===0?"disabled":""}>← Anterior</button>
        ${st.i < cfg.preguntas.length-1
          ? `<button class="btn" id="q-next">Siguiente →</button>`
          : `<button class="btn green" id="q-fin">Terminar ✔</button>`}
      </div>
      <button class="btn ghost" id="q-salir" style="margin-top:10px">✖ Salir del ejercicio</button>
    </div>`;

    document.querySelectorAll("#opts .opt").forEach(b=>{
      b.onclick = () => { st.resp[st.i] = +b.dataset.ix; paint(); };
    });
    $("#btn-repasar").onclick = () => {
      const ix = S.repaso.indexOf(q.id);
      if(ix>=0) S.repaso.splice(ix,1); else S.repaso.push(q.id);
      paint();
    };
    $("#q-prev").onclick = () => { st.i--; paint(); };
    const nx = $("#q-next"); if(nx) nx.onclick = () => { st.i++; paint(); };
    const fin = $("#q-fin"); if(fin) fin.onclick = () => {
      const sinResp = st.resp.filter(r=>r===null).length;
      modal(`<h2>Terminar y calificar</h2><p class="dim">${sinResp>0?`Tienes ${sinResp} pregunta(s) sin responder.`:"Respondiste todo."}</p>
        <div class="row2" style="margin-top:14px">
          <button class="btn ghost" onclick="closeModal()">Revisar</button>
          <button class="btn green" id="conf-fin">Calificar</button>
        </div>`);
      $("#conf-fin").onclick = () => { closeModal(); terminar(false); };
    };
    $("#q-salir").onclick = () => confirmSalirQuiz();
  }

  clearInterval(timerInt);
  timerInt = setInterval(()=>{
    st.t--;
    const el = $("#qtimer");
    if(el){ el.textContent = "⏱ " + fmt(st.t); if(st.t<=30) el.classList.add("low"); }
    if(st.t<=0) terminar(true);
  },1000);
  paint();
}

function pickRandom(arr, n){
  const copy=[...arr], out=[];
  while(out.length<n && copy.length) out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  return out;
}
function clasif(p){ return p>=80?["Fuerte","f"]:p>=50?["Regular","r"]:["Débil","d"]; }

mapa({m}){
  const niveles = S.mundos[m];
  const nodos = [1,2,3].map(n=>{
    const dat = niveles[n];
    const prevOk = n===1 || (niveles[n-1] && niveles[n-1].stars>0);
    const estado = dat && dat.stars>0 ? "done" : prevOk ? "open" : "locked";
    const stars = dat ? "★".repeat(dat.stars)+"☆".repeat(5-dat.stars) : "";
    return `<div class="node-row ${n%2===0?'right':''}">
      <div class="lvl-node ${estado}" onclick="${estado==='locked'?`modal('<h2>Nivel bloqueado</h2><p class=dim>Aprueba el nivel anterior (mínimo 2 de 3 aciertos) para desbloquearlo.</p><button class=btn onclick=closeModal()>Ok</button>')`:`jugarNivel('${m}',${n})`}">
        ${estado==='done'?'✔':estado==='locked'?ICO.lock:n}
      </div>
      <div class="lvl-info"><b>Nivel ${n}</b><span class="dim" style="font-size:13px">${estado==='done'?'Mejor: '+dat.best+'/3':'3 preguntas'}</span><div class="lvl-stars">${stars}</div></div>
    </div>`;
  }).join("");
  render("mapa", `
    <h1>${ICONS[m]} ${m}</h1>
    <p class="dim">Aprueba con 2/3 para desbloquear el siguiente nivel. Repite las veces que quieras: se guarda tu mejor puntaje.</p>
    <div class="map-wrap">${nodos}</div>
  `, "Mundo: "+m);
},

function jugarNivel(m, n){
  const qs = pickRandom(byMat(m), 3);
  startQuiz({titulo:`${m} · Nivel ${n}`, preguntas:qs, tiempoSeg:180, onFinish:(ac)=>{
    marcarActividadHoy();
    const stars = ac===3?5:ac===2?3:ac===1?1:0;
    const aprobado = ac>=2;
    const prev = S.mundos[m][n];
    if(!prev || stars>prev.stars) S.mundos[m][n] = {stars:aprobado?stars:0, best:Math.max(ac, prev?prev.best:0)};
    render("res", `
      <h1 class="center">${aprobado?"¡Nivel aprobado! 🎉":"Casi... 💪"}</h1>
      <div class="score-big">${ac}/3</div>
      <div class="stars-big">${aprobado?"★".repeat(stars)+"☆".repeat(5-stars):"☆☆☆☆☆"}</div>
      <p class="dim center">${aprobado?"Desbloqueaste el siguiente nivel.":"Necesitas 2/3 para aprobar. Reintenta, no pasa nada."}</p>

}

function startExamen(){

    S.histExamen.push({fecha, aciertos:ac, total:8});

      const p = Math.round(d.ok/d.tot*100); const [lbl,cls] = clasif(p);
      return `<div class="mat-row"><span>${ICONS[m]} ${m}</span><span><b>${d.ok}/${d.tot}</b> <span class="pill ${cls}">${lbl}</span></span></div>`;

  }});
}

/* ---------------- BATTLE ROYALE (motor de ronda en vivo simulada) ---------------- */
function startBattleRoyale(){
  const NJUG = 24;
  const qs = pickRandom(BANK, 5);
  const board = {"Tú":0};
  BOT_NAMES.slice(0, NJUG-1).forEach(n => board[n]=0);
  let ronda = 0;

  function jugarRonda(){
    const q = qs[ronda];
    let t = 12;
    render("br", `
      <div class="quiz-head"><span class="badge">Pregunta ${ronda+1}/${qs.length}</span><span class="timer" id="brtimer">⏱ ${t}</span></div>
      <div class="progress"><i style="width:${ronda/qs.length*100}%; background:var(--gold)"></i></div>
      <p class="enunciado">${q.q}</p>
      <div id="bropts">${q.o.map((o,ix)=>`<button class="opt" data-ix="${ix}"><span class="letter">${"ABCD"[ix]})</span><span>${o}</span></button>`).join("")}</div>
      <p class="dim center" style="margin-top:10px">¡Responde rápido! La velocidad también cuenta.</p>
    `, "Batalla en Aula");
    let respondida = false; const start = Date.now();
    document.querySelectorAll("#bropts .opt").forEach(b=>{
      b.onclick = ()=>{
        if(respondida) return; respondida = true; clearInterval(iv);
        const ix = +b.dataset.ix; const tomo = (Date.now()-start)/1000;
        if(ix===q.r){ b.classList.add("ok"); board["Tú"] += Math.round(100 + Math.max(0,12-tomo)*8.3); }
        else b.classList.add("bad");
        setTimeout(siguienteFase, 700);
      };
    });
    const iv = setInterval(()=>{ t--; const el=$("#brtimer"); if(el) el.textContent="⏱ "+t; if(t<=0){ clearInterval(iv); if(!respondida){ respondida=true; siguienteFase(); } } },1000);
  }
  function siguienteFase(){
    // bots responden con probabilidad de acierto y velocidad variable
    Object.keys(board).forEach(n=>{ if(n==="Tú") return;
      const acierta = Math.random() < 0.55; const tomo = 1 + Math.random()*11;
      if(acierta) board[n] += Math.round(100 + Math.max(0,12-tomo)*8.3);
    });
    ronda++;
    if(ronda < qs.length){
      const top5 = Object.entries(board).sort((a,b)=>b[1]-a[1]).slice(0,5);
      render("br", `
        <h1 class="center">Posiciones parciales</h1>
        <div class="card">${top5.map(([n,p],i)=>`<div class="mat-row"><span>${rankIco(i)} ${n}${n==="Tú"?' <span class="badge tag-demo">Tú</span>':''}</span><b class="gold">${p}</b></div>`).join("")}</div>
        <p class="dim center">Siguiente pregunta en unos segundos...</p>
      `, "Posiciones");
      setTimeout(jugarRonda, 1600);
    } else {
      const final = Object.entries(board).sort((a,b)=>b[1]-a[1]);
      const miPos = final.findIndex(([n])=>n==="Tú")+1;
      marcarActividadHoy();
      render("res", `
        <h1 class="center">¡Partida terminada!</h1>
        <div class="stars-big">${miPos<=3?medal(['oro','plata','bronce'][miPos-1]):'#'+miPos}</div>
        <p class="center dim">Quedaste en el lugar <b class="gold">#${miPos}</b> de ${final.length}</p>
        <div class="card"><h2>Podio</h2>${final.slice(0,5).map(([n,p],i)=>`<div class="mat-row"><span>${rankIco(i)} ${n}${n==="Tú"?' <span class="badge tag-demo">Tú</span>':''}</span><b>${p}</b></div>`).join("")}</div>
        <button class="btn" onclick="historyStack=[]; go('competir',{replace:true})">Volver a Competir</button>
      `, "Resultado");
    }
  }
  jugarRonda();
}

/* ---------------- ARENA PVP ---------------- */
function buscarRival(){
  modal(`<h2>Buscando rival… 🔍</h2><p class="dim">Emparejando por trofeos similares...</p>`);
  setTimeout(()=>{

function duelo(rival, rivalTrofeos){
  const qs = pickRandom(BANK, 5);
  startQuiz({titulo:"⚔️ Duelo vs "+rival, preguntas:qs, tiempoSeg:120, onFinish:(ac)=>{
    marcarActividadHoy();
    const acRival = Math.min(qs.length, Math.max(0, Math.round(ac + (Math.random()-0.5)*3)));
    let cambio, resultado;
    if(ac > acRival){ cambio = 20; resultado = "¡Ganaste! 🎉"; }
    else if(ac < acRival){ cambio = -15; resultado = "Perdiste 😕"; }
    else { cambio = 5; resultado = "Empate 🤝"; }
    S.trofeos = Math.max(0, S.trofeos + cambio);
    const info = ligaInfo(S.trofeos);
    render("res", `
      <h1 class="center">${resultado}</h1>
      <div class="card center">
        <div class="mat-row"><span>Tú</span><b>${ac}/${qs.length}</b></div>
        <div class="mat-row"><span>${rival}</span><b>${acRival}/${qs.length}</b></div>
      </div>
      <div class="score-big" style="font-size:34px">${cambio>0?'+':''}${cambio} <span style="color:var(--gold)">${ICO.trofeo}</span></div>
      <p class="center dim">Ahora tienes ${S.trofeos} trofeos · Liga ${info.emoji} ${info.nombre}</p>

  }});
}

/* ---------------- TUTORIA (API real de Anthropic) ---------------- */
let enviando = false;
async function enviarTutoria(){
  const inp = $("#chat-in");
  const texto = inp.value.trim();
  if(!texto || enviando) return;
  if(S.msgsMes<=0 && S.msgsExtra<=0){
    modal('<h2>Se acabaron tus tokens 😅</h2><p class="dim">Recarga 30 tokens por $9 desde tu monedero en Perfil.</p><button class="btn" onclick="closeModal(); go(\'perfil\')">Ir a recargar</button>');
    return;
  }
  enviando = true;
  S.chat.push({role:"user", text:texto});
  SCREENS.tutoria();
  S.chat.push({role:"ia", text:"Pensando… 🤔"});
  SCREENS.tutoria();

  const debiles = S.diagResultado ? S.diagResultado.filter(r=>!r.ok).map(r=>r.m).join(", ") : "aún sin diagnóstico";
  const repasoTxt = S.repaso.map(id=>{ const q=BANK.find(b=>b.id===id); return `- [${q.m} / ${q.t}] ${q.q} (correcta: ${q.o[q.r]})`; }).join("\n") || "ninguna";
  const system = `Eres TutorIA, el tutor de ECOEMS Quest: preparas a estudiantes de secundaria (13-15 años) en México para el examen ECOEMS de ingreso a la prepa. Materias: Español, Habilidad Verbal, Matemáticas, Habilidad Matemática, Biología, Física, Química, Historia, Geografía y Formación Cívica y Ética. Explica paso a paso, con lenguaje claro y ejemplos cotidianos mexicanos, en español. Sé breve (máximo ~150 palabras salvo que pidan más). Si preguntan algo fuera de las materias del examen, redirige con amabilidad al estudio. Contexto del alumno — materias a reforzar: ${debiles}. Preguntas que guardó para repasar:\n${repasoTxt}`;

  const historial = S.chat.filter(c=>!c.err && c.text!=="Pensando… 🤔").slice(-10).map(c=>({role: c.role==="user"?"user":"assistant", content: c.text}));

  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, system, messages:historial})
    });
    const data = await resp.json();
    const textoIA = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    S.chat.pop();
    if(textoIA){
      S.chat.push({role:"ia", text:textoIA});
      if(S.msgsMes>0) S.msgsMes--; else S.msgsExtra--;
    } else {
      S.chat.push({role:"ia", text:"TutorIA no está disponible en este momento. Intenta de nuevo en unos minutos. (No se descontó tu token.)", err:true});
    }
  }catch(e){
    S.chat.pop();
    S.chat.push({role:"ia", text:"TutorIA no está disponible en este momento. Intenta de nuevo en unos minutos. (No se descontó tu token.)", err:true});
  }
  enviando = false;
  SCREENS.tutoria();
}
